<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="段取り帳">
<meta name="theme-color" content="#10121A">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>朝の段取り帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column. Morning = two numbered steps (fixed routine, then reorder the list) and one big "start" button. After that, a single timed list. */
:root {
  --bg: #EDEFF4;
  --surface: #FFFFFF;
  --surface-2: #E3E6EE;
  --ink: #1B1F2E;
  --muted: #5F667B;
  --line: #D3D7E2;
  --gold: #9A6C1E;
  --gold-ink: #FFFFFF;
  --gold-soft: #F3E7CF;
  --indigo: #36478F;
  --indigo-soft: #DEE2F3;
  --ok: #2D7A57;
  --ok-soft: #DCEEE4;
  --warn: #A84B26;
  --warn-soft: #F6E2D8;
  --moon-lit: #E8C77E;
  --moon-dark: #C9CEDB;
  --shadow: 0 1px 2px rgba(27,31,46,.06), 0 6px 20px rgba(27,31,46,.06);
  --f-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10121A; --surface: #191C27; --surface-2: #232736; --ink: #ECEAE4; --muted: #99A0B4; --line: #2D3244;
    --gold: #DDB46A; --gold-ink: #1A1408; --gold-soft: #3A301E; --indigo: #9AA8EE; --indigo-soft: #262C49;
    --ok: #6CC29A; --ok-soft: #1B3127; --warn: #EC9168; --warn-soft: #3A2419; --moon-lit: #F0D592; --moon-dark: #2C3142;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10121A; --surface: #191C27; --surface-2: #232736; --ink: #ECEAE4; --muted: #99A0B4; --line: #2D3244;
  --gold: #DDB46A; --gold-ink: #1A1408; --gold-soft: #3A301E; --indigo: #9AA8EE; --indigo-soft: #262C49;
  --ok: #6CC29A; --ok-soft: #1B3127; --warn: #EC9168; --warn-soft: #3A2419; --moon-lit: #F0D592; --moon-dark: #2C3142;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 600px; margin: 0 auto; padding-inline: 16px; padding-block: 20px calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.label { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }

/* Header */
.dayhead { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.eyebrow { font-size: 13px; color: var(--gold); font-weight: 700; letter-spacing: .08em; }
.date { font-family: var(--f-display); font-size: clamp(26px, 7vw, 34px); font-weight: 700; line-height: 1.2; }
.daynav { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.iconbtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-size: 15px; line-height: 1; padding: 0; }
.iconbtn:hover:not(:disabled) { border-color: var(--gold); }
.iconbtn:disabled { opacity: .3; cursor: default; }
.iconbtn.sm { width: 30px; height: 30px; font-size: 14px; }
.textbtn { border: 0; background: none; color: var(--indigo); font-weight: 500; padding: 4px 6px; font-size: 13px; }
.moon { display: grid; justify-items: end; gap: 2px; font-size: 12px; color: var(--muted); }

/* Steps */
.step { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; align-items: start; margin-top: 6px; }
.step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-mono); font-size: 14px; }
.step h2 { font-family: var(--f-display); font-size: 20px; font-weight: 700; line-height: 1.35; }
.step p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.step p b { color: var(--ink); font-weight: 700; }
.card { background: var(--surface); border-radius: 16px; padding: 12px 16px; display: grid; gap: 6px; }
.mini { list-style: none; margin: 0; padding: 0; display: grid; }
.mini li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.mini li:first-child { border-top: 0; }
.mini li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.mini .mono { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.card .foot, .inner .foot { display: flex; justify-content: flex-end; }

/* Reorder list */
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; background: var(--surface); border-radius: 14px; padding: 10px 10px 10px 12px; }
.prow .num { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-mono); font-size: 14px; padding: 0; }
.prow:first-child .num { background: var(--gold); color: var(--gold-ink); }
.info { min-width: 0; display: grid; gap: 1px; border: 0; background: none; text-align: left; padding: 0; }
.info .title { font-weight: 500; overflow-wrap: anywhere; line-height: 1.45; }
.info .sub { font-size: 12px; color: var(--muted); }
.info .sub .carry { color: var(--warn); font-weight: 500; }
.ctl { display: flex; gap: 4px; align-items: center; }
.later { border: 1px solid var(--line); background: none; border-radius: 999px; font-size: 12px; padding: 4px 9px; color: var(--muted); white-space: nowrap; }
.addrow { display: flex; gap: 8px; background: var(--surface); border-radius: 14px; padding: 6px 6px 6px 14px; border: 1px dashed var(--line); }
.addrow input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; }
.addrow input:focus { outline: none; }
.addrow:focus-within { border-style: solid; border-color: var(--gold); }
/* Brain dump */
.dumplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.dumplist li { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px; align-items: center; background: var(--surface); border-radius: 12px; padding-right: 10px; }
.dumplist button { width: 100%; display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: 12px; align-items: center; background: none; border: 0; padding: 10px 0 10px 14px; text-align: left; }
.dursel { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 5px 8px; font-size: 13px; max-width: 110px; }
.dursel:hover { border-color: var(--gold); }
.chip.appt { background: var(--indigo); color: var(--surface); }
.dumplist .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.dumplist .title { overflow-wrap: anywhere; }
.dumplist .sub, .rankbtn .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.carry { color: var(--warn); font-weight: 500; }
.dumpbox { display: grid; gap: 8px; background: var(--surface); border-radius: 16px; padding: 12px 14px; border: 1px solid var(--line); }
.dumpbox:focus-within { border-color: var(--gold); }
.dumpbox textarea { width: 100%; min-height: 110px; resize: vertical; border: 0; background: transparent; font: inherit; font-size: 16px; line-height: 1.75; color: var(--ink); padding: 0; }
.dumpbox textarea:focus { outline: none; }
.dumpbox .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.dumpbox .row span { font-size: 12px; color: var(--muted); }
.step.done .n { background: var(--ok); }
/* Drag to reorder */
.grip { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); cursor: grab; touch-action: none; border-radius: 10px; -webkit-user-select: none; user-select: none; }
.grip:hover { color: var(--gold); background: var(--surface-2); }
.grip svg { width: 20px; height: 20px; }
.sortlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sortlist li { display: grid; grid-template-columns: 22px minmax(0,1fr) auto 40px; gap: 8px; align-items: center; background: var(--surface); border-radius: 14px; padding: 6px 4px 6px 12px; }
.sortlist .pos { font-family: var(--f-mono); font-size: 13px; color: var(--muted); text-align: center; }
.sortlist li:first-child .pos { color: var(--gold); font-weight: 700; }
.sortlist .info { padding-block: 4px; }
.drag-ghost { opacity: .35; }
.drag-chosen { box-shadow: 0 10px 30px rgba(0,0,0,.28); }
.drag-on { cursor: grabbing; }
.item.flex { grid-template-columns: 52px 28px minmax(0,1fr) 40px; padding-right: 4px; }
.item .grip { align-self: center; }
.flowadd input { width: 100%; border: 0; background: transparent; font-size: 16px; padding: 4px 0; color: var(--ink); }
.flowadd input:focus { outline: none; }
.flowadd .row { justify-content: flex-end; }
.flowadd .row .dursel { margin-right: auto; }
.step.done h2 { font-size: 16px; }
/* Tap-to-rank */
.ranklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ranklist li { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 6px; align-items: center; }
.rankbtn { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1.5px solid transparent; border-radius: 14px; padding: 10px 12px; text-align: left; width: 100%; }
.rankbtn .num { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--f-mono); font-size: 14px; }
.rankbtn .title { overflow-wrap: anywhere; font-weight: 500; }
.ranked .rankbtn { border-color: var(--gold); }
.ranked .rankbtn .num { border: 0; background: var(--gold); color: var(--gold-ink); }
.linkrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.go:disabled { opacity: .45; cursor: default; box-shadow: none; }
.subhead { font-size: 13px; color: var(--muted); font-weight: 500; margin-top: 4px; }
.fixedrow { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 10px; padding: 10px 14px; background: var(--indigo-soft); border-radius: 14px; font-size: 14.5px; border: 0; text-align: left; width: 100%; }
.fixedrow .mono { color: var(--indigo); font-size: 13px; padding-top: 1px; }
.go { width: 100%; border: 0; border-radius: 16px; padding: 16px; font-size: 17px; font-weight: 700; background: var(--gold); color: var(--gold-ink); box-shadow: var(--shadow); }
.note { font-size: 13.5px; color: var(--muted); text-align: center; margin: 0; }

/* Flow list */
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
.section-h h3 { font-family: var(--f-display); font-size: 19px; font-weight: 700; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: 52px 28px minmax(0,1fr); gap: 10px; align-items: start; padding: 12px 12px 12px 8px; background: var(--surface); border-radius: 14px; }
.item.appt { background: var(--indigo-soft); }
.item.routine { background: var(--ok-soft); }
.item.cur { box-shadow: inset 0 0 0 2px var(--gold); }
.item.past { opacity: .6; }
.item .time { text-align: right; font-size: 13px; line-height: 1.35; padding-top: 2px; }
.item .time small { display: block; color: var(--muted); font-size: 11.5px; }
.item.appt .time { color: var(--indigo); }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; padding: 0; margin-top: 1px; display: grid; place-items: center; }
.check:hover { border-color: var(--ok); }
.check.on { background: var(--ok); border-color: var(--ok); }
.check.on::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.body { min-width: 0; cursor: pointer; display: grid; gap: 4px; border: 0; background: none; text-align: left; padding: 0; }
.body .title { font-weight: 500; overflow-wrap: anywhere; line-height: 1.45; }
.meta { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-weight: 500; }
.chip.appt { background: var(--indigo); color: var(--surface); }
.chip.rt { background: var(--ok); color: var(--surface); }
.chip.cur { background: var(--gold); color: var(--gold-ink); }
.chip.late { background: var(--warn-soft); color: var(--warn); }
.rt-ico { width: 24px; height: 24px; display: grid; place-items: center; color: var(--ok); }
.rt-ico svg { width: 20px; height: 20px; }
.nowline { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 10px; align-items: center; padding: 0 12px 0 8px; font-size: 12px; color: var(--warn); font-weight: 700; }
.nowline .time { text-align: right; }
.nowline .bar { height: 2px; background: var(--warn); border-radius: 2px; }
.empty { text-align: center; padding: 24px 16px; color: var(--muted); background: var(--surface); border-radius: 16px; border: 1px dashed var(--line); display: grid; gap: 8px; justify-items: center; font-size: 14px; }
.empty b { color: var(--ink); font-family: var(--f-display); font-size: 17px; }
.notice { border-radius: 14px; padding: 12px 14px; font-size: 13.5px; display: grid; gap: 8px; background: var(--warn-soft); }
.notice.gold { background: var(--gold-soft); }
.notice .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.notice ul { margin: 0; padding-left: 1.1em; }

/* Routine checklist (after the day starts) */
details.routine { background: var(--surface); border-radius: 16px; padding: 12px 16px; }
details.routine summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
details.routine summary::-webkit-details-marker { display: none; }
.rt-h { font-family: var(--f-display); font-size: 17px; font-weight: 700; }
.rt-s { font-size: 12.5px; color: var(--muted); }
.rt-s.ok { color: var(--ok); font-weight: 700; }
.rlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; }
.rlist li { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.rlist li:first-child { border-top: 0; }
.rlist li.done .title { text-decoration: line-through; color: var(--muted); }
.rlist .mono { font-size: 12px; color: var(--muted); }

details.fold { background: var(--surface); border-radius: 14px; padding: 12px 14px; }
details.fold summary { cursor: pointer; font-weight: 500; font-size: 14px; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary::after { content: "＋"; color: var(--muted); }
details.fold[open] summary::after { content: "－"; }
details.fold .inner { margin-top: 10px; display: grid; gap: 10px; }
.donelog { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.donelog li { display: grid; grid-template-columns: 46px 24px minmax(0,1fr); gap: 8px; align-items: center; font-size: 14px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn { border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.soft { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--warn); }

/* Settings */
.intro h1 { font-family: var(--f-display); font-size: clamp(24px, 6vw, 30px); }
.panel { background: var(--surface); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.panel h3 { font-family: var(--f-display); font-size: 18px; }
.panel .lead { margin: 0; font-size: 13px; color: var(--muted); }
.rt-edit { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rt-edit li { display: grid; grid-template-columns: minmax(0,1fr) auto auto auto auto; gap: 6px; align-items: center; }
.rt-edit input, .rt-edit select, .addline select, .addline input, .field input { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; min-width: 0; color: var(--ink); }
.addline { display: flex; gap: 8px; }
.addline input { flex: 1; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.mlist { display: grid; gap: 12px; }
.m { display: grid; gap: 2px; font-size: 13.5px; padding-top: 10px; border-top: 1px solid var(--line); }
.m:first-child { border-top: 0; padding-top: 0; }
.m .who { font-size: 12px; color: var(--muted); }
.m b { color: var(--gold); font-family: var(--f-display); font-size: 15px; }
.m .apply { color: var(--indigo); }
.exportbox { width: 100%; min-height: 70px; font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); padding: 8px; word-break: break-all; }
.item.cal { background: var(--indigo-soft); }
.item.cal .time { color: var(--indigo); }
.item.cal .body { cursor: default; }
.meet { display: inline-flex; align-items: center; gap: 4px; background: var(--indigo); color: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; justify-self: start; }
.meet::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .8; }
.meet:hover { filter: brightness(1.1); }
.calrow .meet { grid-column: 2; }
.cal-ico { width: 24px; height: 24px; display: grid; place-items: center; color: var(--indigo); }
.cal-ico svg { width: 19px; height: 19px; }
.chip.gcal { background: transparent; box-shadow: inset 0 0 0 1px var(--indigo); color: var(--indigo); }
.allday { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.calrow { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 10px; padding: 10px 14px; background: var(--indigo-soft); border-radius: 14px; font-size: 14.5px; }
.calrow .mono { color: var(--indigo); font-size: 13px; padding-top: 1px; }
.gsteps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; font-size: 14px; }
.gsteps a { color: var(--indigo); font-weight: 700; }
.gcode { width: 100%; min-height: 120px; font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); padding: 8px; }
.gstate { font-size: 13.5px; }
.gstate.ok { color: var(--ok); font-weight: 700; }
.gstate.ng { color: var(--warn); font-weight: 700; }
.laterlist { list-style: none; margin: 0; padding: 0; display: grid; }
.laterlist li { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.laterlist li:first-child { border-top: 0; }
.laterlist .title { overflow-wrap: anywhere; }
.laterlist .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.up-sum { font-size: 13.5px; color: var(--muted); margin: 0; }
.up-day { display: grid; gap: 6px; }
.up-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.up-h b { font-family: var(--f-display); font-size: 17px; }
.up-h .rel { font-size: 12px; color: var(--gold); font-weight: 700; }
.up-h .textbtn { margin-left: auto; }
.up-sep { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: .06em; margin-top: 10px; }
.up-sep::before, .up-sep::after { content: ""; flex: 1; height: 1px; background: var(--gold); opacity: .35; }
.uplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script>
(() => {
const DURS = [15, 30, 45, 60, 90, 120];
const RT_DURS = [5, 10, 15, 20, 30, 45, 60];
const WD = '日月火水木金土';
const DEF = {
  dayStart: '07:00', dayEnd: '01:00', buffer: 10,
  nightStart: '22:00', nightRoutines: [],
  routines: [
    { id: 'rex1', title: '（例）今日のカードを1枚引く', dur: 5 },
    { id: 'rex2', title: '（例）予約と入金の確認', dur: 10 },
    { id: 'rex3', title: '（例）LINE・DMの返信', dur: 15 },
    { id: 'rex4', title: '（例）ストーリーズ投稿', dur: 10 },
  ],
};
const METHODS = [
  { who: 'デビッド・アレン（GTD提唱者）', t: '頭の中を全部書き出す', a: '朝はまず思いつくまま全部書き出し、そのあとで優先順位をつけます。' },
  { who: 'アイビー・リー（経営コンサルタント）', t: '前夜に書き、朝は上から順に', a: '前の晩に明日やることを書き出しておけば、朝は書き足して順番を決めるだけです。' },
  { who: 'ブライアン・トレーシー（作家・コンサルタント）', t: 'いちばん重い仕事を最初に', a: '優先順位をつけるときは、いちばん重くて大事な仕事を最初にタップするのがおすすめです。' },
  { who: 'アイゼンハワー（第34代アメリカ大統領）', t: '急ぎと大事を分ける', a: '急ぎだけど大事ではないものは下へ。今日でなくていいものは「明日へ」。' },
  { who: 'スティーブ・ジョブズ（Apple共同創業者）', t: '集中とは、ノーと言うこと', a: '時間内に入りきらない分は、一覧の下にまとめて表示し、まとめて翌日へ回せます。' },
  { who: 'イーロン・マスク（テスラ・スペースX CEO）', t: '時間を箱で区切る', a: '「この順番で始める」を押すと、かかる時間をもとに一つずつ時刻が入ります。' },
  { who: 'ジェフ・ワイナー（元LinkedIn CEO）', t: '予定の間に余白を', a: 'やることの間に余白（初期設定10分）を自動で挟みます。' },
  { who: 'マーク・アンドリーセン（投資家）', t: 'やったことを書き留める', a: '終えたことは「終わったこと」に時刻つきで残ります。' },
];
const REFS = 'Sunsama（毎朝の計画の儀式）・Things 3（静かな「今日」画面）・Todoist（一行入力）・Structured（縦のタイムライン）';

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
// The working day can run past midnight (e.g. until 01:00). Minutes after midnight up to that
// end time still belong to the previous day.
const rollover = () => { const s = toMin(S.settings.dayStart), e = toMin(S.settings.dayEnd); return e <= s ? e : 0; };
const endMin = () => { const s = toMin(S.settings.dayStart), e = toMin(S.settings.dayEnd); return e <= s ? e + 1440 : e; };
const timeMin = hm => { const m = toMin(hm); return m < rollover() ? m + 1440 : m; };
const todayStr = () => ymd(new Date(Date.now() - rollover() * 60000));
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const toMin = hm => { const [h, m] = String(hm).split(':').map(Number); return h * 60 + (m || 0); };
const fmt = m => { m = Math.max(0, Math.round(m)); return `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`; };
const nowMin = () => { const d = new Date(), m = d.getHours() * 60 + d.getMinutes(); return m < rollover() ? m + 1440 : m; };
const hm = ts => ts ? fmt(new Date(ts).getHours() * 60 + new Date(ts).getMinutes()) : '';
const durTxt = m => m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}` : `${m}分`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dateLabel = s => { const d = parseYmd(s); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const relLabel = s => { const t = todayStr(); return s === t ? '今日' : s === addDays(t, 1) ? '明日' : s === addDays(t, -1) ? '昨日' : ''; };
const isEx = r => String(r.title || '').startsWith('（例）');
const sum = (l, f) => l.reduce((s, x) => s + f(x), 0);
const durOptions = cur => [...new Set([10, 15, 20, 30, 45, 60, 90, 120, 180, cur])].sort((a, b) => a - b).map(m => `<option value="${m}"${m === cur ? ' selected' : ''}>${durTxt(m)}</option>`).join('');
const durSel = t => `<select class="dursel" id="dur-${t.id}" aria-label="「${esc(t.title)}」にかかる時間">${durOptions(t.dur || 30)}</select>`;

// ---------- state & storage ----------
const S = { dragging: false, tasks: new Map(), days: new Map(), settings: { ...DEF }, view: 'today', viewDate: '', mode: 'connecting', db: null, loaded: false, fresh: null, pendingRender: false };
S.viewDate = todayStr();
// Google Calendar events (web version only), cached per date in this browser.
S.cal = (() => { try { return JSON.parse(localStorage.getItem('dandori.cal')) || {}; } catch (e) { return {}; } })();
S.calLoading = {};
function saveCal() {
  try { const keep = Object.keys(S.cal).sort().slice(-14); localStorage.setItem('dandori.cal', JSON.stringify(Object.fromEntries(keep.map(k => [k, S.cal[k]])))); } catch (e) {}
}
const LS = 'dandori.v1';
// Unsent brain-dump text, kept per date so a re-render or reload never loses it.
const DRAFT = 'dandori.draft';
S.draft = (() => { try { return JSON.parse(localStorage.getItem(DRAFT)) || {}; } catch (e) { return {}; } })();
function saveDraft() { try { localStorage.setItem(DRAFT, JSON.stringify(S.draft)); } catch (e) {} }
function loadCache() { try { const raw = localStorage.getItem(LS); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function saveCache() { try { localStorage.setItem(LS, JSON.stringify({ tasks: [...S.tasks.values()], days: [...S.days.values()], settings: S.settings, mode: S.mode })); } catch (e) {} }
const chains = {};
function write(path, op) {
  saveCache();
  if (S.mode !== 'cloud') return;
  chains[path] = (chains[path] || Promise.resolve()).then(() => op(S.db.doc(path))).catch(e => {
    toast(e && e.code === 'quota_exceeded' ? '保存容量がいっぱいです。終わったことを削除してください' : '保存できませんでした。通信を確認して、もう一度操作してください');
  });
}
function bodyOf(t) { const { id, ...b } = t; return JSON.parse(JSON.stringify(b)); }
function putTask(t, quiet) { S.tasks.set(t.id, t); if (!quiet) render(); write('tasks/' + t.id, r => r.set(bodyOf(t))); }
function delTask(id) { S.tasks.delete(id); render(); write('tasks/' + id, r => r.delete()); }
function saveSettings() { saveCache(); render(); write('settings/main', r => r.set(JSON.parse(JSON.stringify(S.settings)))); }
const dayDoc = d => S.days.get(d) || { date: d };
function setDay(d, patch, quiet) {
  const doc = { ...dayDoc(d), ...patch, date: d };
  S.days.set(d, doc); if (!quiet) render();
  write('days/' + d, r => r.set(JSON.parse(JSON.stringify(doc))));
}
// Two kinds of daily fixed tasks: morning (first thing) and night (from a set time).
const RK = {
  am: { key: 'routines', done: 'routine', label: '朝の固定タスク', box: 'routine', panel: 'routines-panel', pre: 'rt' },
  pm: { key: 'nightRoutines', done: 'night', label: '夜の固定タスク', box: 'nightroutine', panel: 'night-panel', pre: 'rn' },
};
const routinesOf = k => S.settings[RK[k].key] || [];
const routineDoneOn = (d, k = 'am') => dayDoc(d)[RK[k].done] || {};
const calDoneOn = d => dayDoc(d).calDone || {};
function toggleCal(d, cid) {
  const cur = { ...calDoneOn(d) };
  if (cur[cid]) delete cur[cid]; else cur[cid] = Date.now();
  setDay(d, { calDone: cur });
  if (cur[cid]) toast('終わりました');
}
function toggleRoutine(d, rid, k = 'am') {
  const cur = { ...routineDoneOn(d, k) };
  if (cur[rid]) delete cur[rid]; else cur[rid] = Date.now();
  setDay(d, { [RK[k].done]: cur });
  const R = routinesOf(k);
  if (cur[rid] && R.length && R.every(r => cur[r.id])) toast(k === 'pm' ? '夜の固定タスク完了。今日もおつかれさまでした' : '朝の固定タスク完了。ここから本番です');
}

function sampleTasks() {
  const d = todayStr(), now = Date.now();
  return [
    { title: '（例）新月の講座の構成を考える', time: null, dur: 90 },
    { title: '（例）今月の売上とLINE登録数を確認', time: null, dur: 30 },
    { title: '（例）インスタのリール投稿', time: null, dur: 45 },
    { title: '（例）鑑定の感想DMに返信', time: null, dur: 20 },
    { title: '（例）オンライン鑑定 A様', time: '13:00', dur: 60 },
    { title: '（例）オンライン鑑定 B様', time: '16:00', dur: 45 },
  ].map((t, i) => ({ id: 'ex' + i, date: d, done: false, doneAt: null, createdAt: now + i, order: i, example: true, ...t }));
}

async function init() {
  const c = loadCache();
  if (c && Array.isArray(c.tasks)) { c.tasks.forEach(t => S.tasks.set(t.id, t)); S.settings = { ...DEF, ...(c.settings || {}) }; }
  if (c && Array.isArray(c.days)) c.days.forEach(x => x && x.date && S.days.set(x.date, x));
  render();
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) {
    S.mode = 'local'; S.loaded = true;
    if (!c || !c.tasks || (!c.tasks.length && c.mode !== 'local')) sampleTasks().forEach(t => S.tasks.set(t.id, t));
    S.importData = readImport();
    ensureToken();
    window.addEventListener('hashchange', () => { S.importData = readImport(); render(); });
    saveCache(); render(); return;
  }
  S.db = db; S.mode = 'cloud';
  db.collection('tasks').limit(1000).onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => m.set(d.id, { ...d.data(), id: d.id }));
    S.tasks = m; S.loaded = true; saveCache(); render();
  }, () => { toast('同期が止まりました。ページを開き直してください'); });
  db.collection('days').orderBy('date', 'desc').limit(60).onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => m.set(d.id, d.data()));

  }, () => {});
  db.doc('settings/main').onSnapshot(s => {

}

// ---------- ordering & planning ----------
const legacyRank = t => (t.frog ? 0 : 1) * 10 + (t.imp && t.urg ? 1 : t.imp ? 2 : t.urg ? 3 : 4);
const byOrder = (a, b) => ((a.order ?? 1e9) - (b.order ?? 1e9)) || (legacyRank(a) - legacyRank(b)) || ((a.createdAt || 0) - (b.createdAt || 0));
// Things to put in order for day d. On today, unfinished items from earlier days come along.
function planList(d) {
  const t0 = todayStr();
  return [...S.tasks.values()].filter(t => !t.done && !t.time && t.date && (t.date === d || (d === t0 && t.date < t0))).sort(byOrder);
}
const fixedList = d => [...S.tasks.values()].filter(t => !t.done && t.time && t.date === d).sort((a, b) => timeMin(a.time) - timeMin(b.time));
const nextOrder = d => 1 + Math.max(-1, ...[...S.tasks.values()].filter(t => t.date === d && t.order != null).map(t => t.order));

function planDay(d) {
  const st = S.settings, buf = Math.max(0, +st.buffer || 0), dayEnd = endMin();
  const isToday = d === todayStr();
  let start = toMin(st.dayStart);
  if (isToday) start = Math.max(start, Math.ceil(nowMin() / 5) * 5);
  const busy = fixedList(d).map(t => ({ t, start: timeMin(t.time), end: timeMin(t.time) + (t.dur || 30), fixed: true }));
  const cal = calEvents(d);
  const cDone = calDoneOn(d);
  cal.timed.filter(ev => !cDone[ev.id]).forEach(ev => busy.push({ cal: true, fixed: true, ev, t: { id: 'cal_' + ev.id, title: ev.title }, start: ev.s, end: ev.e }));
  const calDone = cal.timed.filter(ev => cDone[ev.id]).map(ev => ({ ev, doneAt: cDone[ev.id] }));
  // Earliest slot at or after `from` that clears every fixed block. Tasks are placed strictly in
  // priority order (each starts after the previous one), so a short task never jumps ahead.
  const fit = (dur, from) => [from, ...busy.map(b => b.end + buf)].filter(c => c >= from).sort((a, b) => a - b)
    .find(c => c + dur <= dayEnd && busy.every(b => c >= b.end + buf || c + dur + buf <= b.start));
  let cursor = start;
  const nights = st.nightRoutines || [], nDone = routineDoneOn(d, 'pm'), nOpen = nights.filter(r => !nDone[r.id]);
  if (nOpen.length) { const ns = timeMin(st.nightStart || '22:00'); busy.push({ routine: true, kind: 'pm', fixed: true, t: { id: '__night' }, start: ns, end: ns + sum(nOpen, r => r.dur || 10) }); }
  const routines = st.routines || [], rDone = routineDoneOn(d), rOpen = routines.filter(r => !rDone[r.id]);
  if (rOpen.length) {
    const dur = sum(rOpen, r => r.dur || 10), at = fit(dur, cursor);
    if (at !== undefined) { busy.push({ routine: true, t: { id: '__routine' }, start: at, end: at + dur }); cursor = at + dur + buf; }
  }
  const overflow = [];
  for (const t of [...S.tasks.values()].filter(t => !t.done && !t.time && t.date === d).sort(byOrder)) {
    const dur = t.dur || 30, at = overflow.length ? undefined : fit(dur, cursor);
    if (at === undefined) { overflow.push(t); continue; }
    busy.push({ t, start: at, end: at + dur }); cursor = at + dur + buf;
  }
  const done = [...S.tasks.values()].filter(t => t.done && t.date === d).sort((a, b) => (a.doneAt || 0) - (b.doneAt || 0));
  return { items: busy.sort((a, b) => a.start - b.start), overflow, done, isToday, routines, rDone, rOpen, nights, nDone, nOpen, allDay: cal.allDay, calDone };
}

// ---------- moon ----------
const SYN = 29.530588853;
function moonAge(d) { const ref = Date.UTC(2000, 0, 6, 18, 14) / 864e5; const x = new Date(d); x.setHours(12); return (((x.getTime() / 864e5 - ref) % SYN) + SYN) % SYN; }
function moonName(a) {
  for (const [lim, n] of [[1.5, '新月'], [6, '三日月'], [9, '上弦の月'], [13, '十三夜月'], [16.5, '満月'], [20.5, '十六夜〜更待月'], [24, '下弦の月'], [28, '有明月']]) if (a < lim) return n;
  return '新月';
}
function moonSVG(age, size = 32) {
  const p = age / SYN * 2 * Math.PI, c = size / 2, r = c - 1.5, rx = Math.abs(Math.cos(p)) * r, cos = Math.cos(p);
  const d = age < SYN / 2
    ? `M${c} ${c - r}A${r} ${r} 0 0 1 ${c} ${c + r}A${rx} ${r} 0 0 ${cos > 0 ? 0 : 1} ${c} ${c - r}Z`
    : `M${c} ${c - r}A${r} ${r} 0 0 0 ${c} ${c + r}A${rx} ${r} 0 0 ${cos > 0 ? 1 : 0} ${c} ${c - r}Z`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="var(--moon-dark)"/><path d="${d}" fill="var(--moon-lit)"/></svg>`;
}

// Morning check-in (today before starting) and evening prep (future days)
function renderPlan(d) {
  const t0 = todayStr(), isT = d === t0, list = planList(d), fixed = fixedList(d), R = S.settings.routines || [];

    ? `<details class="fold"><summary>夜の固定タスク（${esc(S.settings.nightStart || '22:00')}から ${NR.length}つ・約${durTxt(sum(NR, r => r.dur || 10))}）</summary><div class="inner"><ul class="mini">${NR.map(r => `<li><span>${esc(r.title)}</span><span class="mono">${durTxt(r.dur || 10)}</span></li>`).join('')}</ul><div class="foot"><button class="textbtn" data-act="rtEdit" data-k="pm">編集する</button></div></div></details>`

    h += `<ol class="sortlist" id="sortPlan">${list.map((t, i) => `<li data-id="${t.id}"${S.fresh === t.id ? ' class="fresh"' : ''}><span class="pos">${i + 1}</span><button class="info" data-act="edit" data-id="${t.id}"><span class="title">${esc(t.title)}</span>${t.date < d ? '<span class="sub"><span class="carry">昨日から</span></span>' : ''}</button>${durSel(t)}${GRIP}</li>`).join('')}</ol>`;

// The day after "start": one timed list

      ...P.done.map(t => ({ at: t.doneAt || 0, html: `<li><span class="mono muted">${hm(t.doneAt)}</span><button class="check on" data-act="toggle" data-id="${t.id}" aria-label="「${esc(t.title)}」を未完了に戻す"></button><span>${esc(t.title)}</span></li>` })),

  if (P.isToday) h += `<div class="btnrow"><button class="btn soft" data-act="replan">順番を変える</button><button class="btn soft" data-act="next">明日の準備をする →</button></div>`;

// ---------- quick-add parsing ----------
function parseQuick(text) {
  let s = ' ' + text.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/：/g, ':') + ' ';
  const r = {};
  const take = (re, fn) => { const m = s.match(re); if (m && fn(m) !== false) s = s.replace(m[0], ' '); };
  const okT = (h, m) => h >= 0 && h < 24 && m >= 0 && m < 60;
  take(/(明後日|あさって)/, () => { r.date = addDays(todayStr(), 2); });
  take(/(明日|あした)/, () => { r.date = addDays(todayStr(), 1); });
  take(/(今日|きょう)/, () => { r.date = todayStr(); });
  take(/(\d{1,2})時(\d{1,2})分/, m => okT(+m[1], +m[2]) ? (r.time = `${pad(+m[1])}:${pad(+m[2])}`) : false);
  take(/(\d{1,2})時半/, m => okT(+m[1], 30) ? (r.time = `${pad(+m[1])}:30`) : false);
  take(/(\d+(?:\.\d+)?)\s*時間(半)?/, m => { r.dur = Math.round(parseFloat(m[1]) * 60) + (m[2] ? 30 : 0); });
  take(/(\d{1,2})時(?!間)/, m => okT(+m[1], 0) ? (r.time = `${pad(+m[1])}:00`) : false);
  take(/(\d{1,2}):(\d{2})/, m => okT(+m[1], +m[2]) ? (r.time = `${pad(+m[1])}:${m[2]}`) : false);
  take(/(\d+)\s*(分|min)/i, m => { r.dur = +m[1]; });
  take(/(\d+(?:\.\d+)?)\s*h(?![a-z])/i, m => { r.dur = Math.round(parseFloat(m[1]) * 60); });
  r.title = s.replace(/\s+/g, ' ').trim();
  if (r.dur != null && !(r.dur > 0)) delete r.dur;
  return r;
}

$('#f-date').addEventListener('change', e => { if (e.target.value) { F.manual.date = e.target.value; syncSheet(); } });
$('#f-time').addEventListener('change', e => { F.manual.time = e.target.value || null; syncSheet(); });
$('#sheet').addEventListener('submit', e => { e.preventDefault(); submitSheet(); });
$('#f-title').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault(); });
function submitSheet() {
  const raw = $('#f-title').value.trim();
  const title = raw;
  if (!title) { toast('やることを入れてください'); $('#f-title').focus(); return; }
  const e = eff(), old = F.id ? S.tasks.get(F.id) : null;
  const wait = e.date === 'WAIT', date = wait ? null : e.date;
  const moved = !old || old.date !== date;
  const t = { ...(old || {}), id: F.id || uid(), title, date, wait, time: wait ? null : e.time || null, dur: e.dur || 30, done: old ? !!old.done : false, doneAt: old ? old.doneAt || null : null, createdAt: old ? old.createdAt : Date.now(), order: moved ? (wait ? 0 : nextOrder(date)) : old.order, note: $('#f-note').value.trim() };
  if (old && old.example && title !== old.title) delete t.example;
  S.fresh = t.id; putTask(t);
  if (F.id) { closeSheet(); toast('保存しました'); }
  else {
    $('#f-title').value = ''; F.parsed = {}; F.manual = {}; F.base = { ...F.base, date: t.date }; $('#f-note').value = ''; syncSheet();
    toast(t.wait ? 'タイミング待ちに置きました' : `${relLabel(t.date) || dateLabel(t.date)}に入れました`);
  }
}
$('#delBtn').addEventListener('click', () => {
  const b = $('#delBtn');
  if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'もう一度押すと削除'; setTimeout(() => { b.dataset.armed = ''; b.textContent = '削除'; }, 3000); return; }
  b.dataset.armed = ''; b.textContent = '削除';
  delTask(F.id); closeSheet(); toast('削除しました');
});
$('#waitBtn').addEventListener('click', () => {
  const t = S.tasks.get(F.id); if (!t) return;
  closeSheet();
  if (isWait(t)) { const t0 = todayStr(); S.fresh = t.id; putTask({ ...t, wait: false, date: t0, order: nextOrder(t0) }); toast('今日のやることに入れました'); }
  else moveToWait(t.id);
});
$('#tmrBtn').addEventListener('click', () => {
  const t = S.tasks.get(F.id); if (!t) return;
  const nd = addDays(!t.date || t.date < todayStr() ? todayStr() : t.date, 1);
  putTask({ ...t, date: nd, wait: false, order: nextOrder(nd) }); closeSheet(); toast(`${relLabel(nd) || dateLabel(nd)}へ回しました`);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  else if ((e.key === 'n' || e.key === 'N') && $('#sheet').hidden && !e.target.closest('input, select, textarea') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); openSheet(); }
});

let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2400); }

// Keep "now" honest, and roll over to the new day after midnight.
let lastDay = todayStr();
function tick() { const t = todayStr(); if (t !== lastDay) { if (S.viewDate === lastDay) S.viewDate = t; lastDay = t; } }
setInterval(() => { tick(); if (S.view === 'today' && $('#sheet').hidden) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); } });

init();
})();
</script>
</body>
</html>
